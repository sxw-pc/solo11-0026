# LakeBack default configuration. Paths are relative to this file.
[paths]
lake = "data/lake"
ledger = "data/ledger"
snapshots = "data/snapshots"
reports = "data/reports"
fixtures = "data/fixtures"
seed = "lakeback/fixtures/seed.toml"

[storage]
backend = "parquet"

[service]
host = "127.0.0.1"
port = 5000

[clock]
mode = "system"
# Set mode = "fixed" and fixed_time = "2025-01-01T00:00:00Z" for reproducible demos.

[keys]
orders = "order_id"
users = "user_id"
refunds = "refund_id"
