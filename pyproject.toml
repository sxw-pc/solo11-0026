[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeback"
version = "0.1.0"
description = "Offline lakehouse snapshot ledger, time travel and backfill auditor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LakeBack maintainers" }]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7", "pyarrow>=14"]

[project.scripts]
lakeback = "lakeback.cli:main"

[tool.setuptools.packages.find]
include = ["lakeback*"]

[tool.setuptools.package-data]
lakeback = ["fixtures/seed.toml", "service/static/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
