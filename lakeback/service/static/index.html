<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LakeBack Query Console</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    body { margin: 2rem auto; max-width: 980px; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.4rem; letter-spacing: .04em; }
    form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; align-items: end; }
    label { display: grid; gap: .25rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
    input, button { font: inherit; padding: .5rem .6rem; border: 1px solid #8888; border-radius: .35rem; background: transparent; }
    button { cursor: pointer; border-color: #4a8; }
    pre { border: 1px solid #8884; border-radius: .4rem; padding: 1rem; overflow: auto; max-height: 65vh; }
    .hint { opacity: .65; font-size: .8rem; }
    @media (max-width: 700px) { form { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <h1>LakeBack / time-travel console</h1>
  <p class="hint">Read-only loopback service. Version or ISO-8601 time accepted. Partition form: dt=2024-01-01.</p>
  <form id="query">
    <label>Table <input name="table" value="orders" required></label>
    <label>At <input name="at" value="1" required></label>
    <label>Partition <input name="partition" placeholder="dt=2024-01-01"></label>
    <button type="submit">Travel</button>
  </form>
  <p><button id="tables" type="button">List registered tables</button></p>
  <pre id="output">Ready.</pre>
  <script>
    const out = document.getElementById("output");
    async function show(url) {
      out.textContent = "Loading " + url;
      try {
        const response = await fetch(url);
        const payload = await response.json();
        out.textContent = JSON.stringify(payload, null, 2);
      } catch (error) {
        out.textContent = "Request failed: " + error;
      }
    }
    document.getElementById("query").addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      const query = new URLSearchParams();
      query.set("table", data.get("table"));
      query.set("at", data.get("at"));
      if (data.get("partition")) query.set("partition", data.get("partition"));
      show("/api/travel?" + query.toString());
    });
    document.getElementById("tables").addEventListener("click", () => show("/api/tables"));
  </script>
</body>
</html>
